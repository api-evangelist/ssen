  - type: Website
    url: https://www.ssen.co.uk/
- aid: ssen:ssen-power-track-real-time-outage-api
  name: SSEN Power Track Real Time Outage API
  description: >-
    Anonymous JSON API behind the SSEN Power Track map, returning planned and unplanned outages on the
    SSEN Distribution network with fault reference, type, latitude/longitude, estimated restoration time
    and affected postcodes, plus a per-fault lookup by reference. Published as an API resource on the
    Real Time Outage Dataset under CC BY 4.0 and verified live with no credentials.
  humanURL: https://data.ssen.co.uk/@ssen-distribution/realtime_outage_dataset
  baseURL: https://external.distribution.prd.ssen.co.uk/opendataportal-prd/v4/api
  tags:
  - Outages
  - Real-Time
  - Open Data
  - Electricity
  tags_raw:
  - Outages
  - Real Time
  - Open Data
  - Electricity
  properties:
  - type: Documentation
    url: https://data.ssen.co.uk/@ssen-distribution/realtime_outage_dataset
  - type: Documentation
    url: https://powertrack.ssen.co.uk/powertrack
- aid: ssen:ssen-nerda-api
  name: SSEN NeRDA (Near Real-time Data Access) API
  description: >-
    Near real-time power flow data from SSEN Distribution's EHV, HV and LV networks, drawn from SCADA
    PowerOn, LV monitoring equipment, the load model forecasting tool, the connectivity model and the
    Long Term Development Statement. The documented endpoints are a static substation endpoint per licence
    area (nerdastatic-SEPD, nerdastatic-SHEPD) and time-series endpoints (nerdart_after, nerdart_between)
    queried by nerda_measurement_id and ISO 8601 timestamps. Access requires a free SSEN account, acceptance
    of the portal terms and conditions, and an API key generated in the portal API console; anonymous
    calls to the documented endpoints return 404.
  humanURL: >-
    https://www.ssen.co.uk/our-services/tools-and-maps/near-real-time-data-access-nerda-portal/
  baseURL: https://nerda.opengrid.com/api
