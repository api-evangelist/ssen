  - id: ofgem-data-best-practice
    conforms: true
    evidence: >-
      Licence condition under RIIO-ED2. Implemented visibly — Presumed Open
      publication, and published SSEN Data Triage record PDFs attached as
      resources to datasets (e.g. external-data-triage-ecr-artefact.pdf on the
      Embedded Capacity Register).
    note: >-
      This is a regulatory open-data obligation, not a certification. SSEN
      publishes no SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP attestation, so
      no Compliance pointer is asserted.

