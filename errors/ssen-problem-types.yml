format: vendor-json
rfc9457: false
description: >-
  SSEN's public APIs do not use RFC 9457 problem+json. Each surface returns its
  platform's own error envelope. The Transmission Explore API returns a
  {error_code, message} object with stable string codes; the Distribution CKAN
  Action API returns the CKAN {help, success:false, error:{__type, message}}
  envelope with HTTP 200-or-status semantics; the Power Track outage API returns
  {statusCode, message}.

envelopes:
  - api: SSEN Transmission Open Data Explore API
    content_type: application/json; charset=utf-8
    fields: [error_code, message]
    quota_fields: [errorcode, error, call_limit, limit_time_unit, reset_time]
    note: >-
      Note the inconsistency in the platform itself — 4xx bodies use error_code
      (snake, string) while the 429 quota body uses errorcode (no underscore,
      numeric).
  - api: SSEN Distribution Data Portal API (CKAN 2.10.10)
    content_type: application/json
    fields: [help, success, error.__type, error.message]
  - api: SSEN Power Track Real Time Outage API
    content_type: application/json
    fields: [statusCode, message]

