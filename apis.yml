apis:
- aid: ssen:ssen-distribution-data-portal-api
  name: SSEN Distribution Data Portal API
  description: >-
    The public CKAN 2.10.10 Action API behind the SSEN Distribution Data Portal, serving 45 open datasets
    covering substations, LV feeder smart meter half-hourly usage, the Embedded Capacity Register, flexibility
    market registers, Distribution Future Energy Scenarios, licence area boundaries and Long Term Development
    Statements. Verified anonymously — no key, no registration. Most datasets carry a CC BY 4.0 licence.
  humanURL: https://data.ssen.co.uk/
  baseURL: https://data-api.ssen.co.uk/api/3/action
  tags:
  - Open Data
  - CKAN
  - Catalog
  - Electricity
  - Grid
