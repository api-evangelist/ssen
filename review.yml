findings:
  summary: |
    SSEN is a genuinely open network distributor with four reachable APIs, three of
    them anonymous, and exactly zero consumer-facing data APIs. That is not a gap in
    SSEN's programme — it is the shape of the Great Britain regime. Britain mandated
    the infrastructure (the DCC smart meter monopoly) and the disclosure (Ofgem Data
    Best Practice "Presumed Open" under RIIO-ED2), and never mandated a consumer
    data right. SSEN implements what it was actually told to implement, and the
    evidence is verifiable — published Open Data Triage records attached to
    datasets, CC BY 4.0 licensing, and the first GB DNO publication of full smart
    meter half-hourly consumption data, aggregated to a 5-property floor so no
    individual customer is identifiable. The mandate/implementation distinction that
    breaks other markets does not bite here because the mandate never promised
    consumer access in the first place.
  onlyOneSpec: |
    Only one machine-readable contract exists and SSEN did not write it. The
    Transmission portal inherits Opendatasoft's OpenAPI; the Distribution CKAN
    Action API is self-describing via help_show but ships no OpenAPI; the Power Track
    outage API and the NeRDA API are bespoke SSEN builds documented only in prose —
    a dataset page and a 12-page PDF guide respectively. Four APIs, one spec, and the
    one spec is the vendor's.
  twoPortalsTwoPlatforms: |
    The SSEN brand covers two licensed businesses that made independent platform
    choices — Distribution on CKAN (data.ssen.co.uk front end, data-api.ssen.co.uk
    backend) and Transmission on Opendatasoft. There is no unified SSEN developer
    portal, no developer.* subdomain, and no single catalog spanning both.

