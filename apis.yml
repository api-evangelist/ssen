name: Scottish and Southern Electricity Networks
kind: company
description: Scottish and Southern Electricity Networks (SSEN) is the SSE plc electricity
  networks business in the United Kingdom, operating the poles-and-wires layer rather
  than selling energy. SSEN Distribution is the licensed Distribution Network Operator
  for two GB licence areas — Scottish Hydro Electric Power Distribution (SHEPD) in
  the north of Scotland and Southern Electric Power Distribution (SEPD) in central
  southern England — serving over 3.9 million homes and businesses, while SSEN Transmission
  owns and operates the high-voltage transmission system for the north of Scotland.
  Its API posture is the classic network-distributor split — grid and market data
  are genuinely open, consumer data is not offered at all. SSEN runs a CKAN open data
  portal whose anonymous Action API serves 45 datasets, an anonymous real-time outage
  API behind Power Track, a key-gated near-real-time power-flow API (NeRDA) covering
  EHV/HV/LV networks, and an Opendatasoft Explore API over 60 transmission datasets.
  There is no consumer data-portability mandate in Great Britain equivalent to the
  Australian Consumer Data Right or Ontario's Green Button regulation, and SSEN publishes
  no API through which a third party can obtain an individual customer's usage or
  billing data. What Britain mandated instead is infrastructure and disclosure — smart
  meter traffic runs through the licensed Smart DCC monopoly, and Ofgem's Data Best
  Practice licence condition under RIIO-ED2 obliges network licensees to treat data
  assets as Presumed Open subject to Open Data Triage. SSEN implements that obligation
  visibly — it became the first DNO to publish full smart meter half-hourly consumption
  data, aggregated to no fewer than five properties per LV feeder, and attaches published
  Open Data Triage records to its datasets.
