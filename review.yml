aid: ssen
name: Scottish and Southern Electricity Networks
review:
  question: Does SSEN publish real, documented, reachable APIs — and is any consumer
    energy-data mandate actually implemented?
  answer: true
  date: '2026-07-27'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: network-distributor
  scope: |
    Bootstrap review of SSEN (SSE plc electricity networks). Covers both licensed
    businesses that trade under the SSEN brand — SSEN Distribution (the DNO for the
    SHEPD and SEPD licence areas) and SSEN Transmission (the north of Scotland
    transmission owner). Every URL below was probed on 2026-07-27 and the HTTP
    status recorded verbatim.

energyMandate:
  regime: smart-meter-infrastructure
  status: live-implemented
  homeMarket: United Kingdom
  regimeVerbatim: |
    Great Britain mandated the INFRASTRUCTURE and the DISCLOSURE, not a consumer
    data right. Two obligations touch SSEN and neither is a portability right:

      1. Smart metering infrastructure. GB smart meter traffic runs over the Smart
         Data Communications Company (DCC), a licensed monopoly governed by the
         Smart Energy Code. SSEN as a DNO takes smart meter data through that
         infrastructure via what it calls its "smart meter adapter" (stated in the
         Smart Meter LV Feeder Usage dataset description on data.ssen.co.uk).

      2. Ofgem Data Best Practice. Under the RIIO-ED2 price control (from April
         2023) network licensees carry a licence condition requiring compliance with
         Ofgem's Data Best Practice Guidance, whose core principle is "Presumed
         Open" data subject to Open Data Triage. This is an OPEN DATA publishing
         obligation on the network company, not a right vested in a consumer.

    There is NO Great Britain equivalent of the Australian Consumer Data Right for
    energy, and no Green Button regulation of the Ontario kind. Nothing compels SSEN
    to expose an individual customer's usage or billing data to an accredited third
    party, and SSEN publishes no such API.
  statusEvidence: |
    Marked live-implemented for the obligations that actually apply, and the
    evidence is an artifact, not a claim:
      - Smart Meter LV Feeder Usage dataset is published and live on the portal
        (HTTP 200), sourced from smart meters through the DCC route and anonymised
        by aggregation to no fewer than 5 properties per LV feeder. SSEN was the
        first GB DNO to publish full smart meter half-hourly consumption datasets.
      - Open Data Triage under Data Best Practice is evidenced directly: multiple
        CKAN datasets carry a published "SSEN Data Triage record" PDF resource
        (e.g. external-data-triage-ecr-artefact.pdf on the Embedded Capacity
        Register, external-data-triage-form-sims-powertrack-artefact-pdf.pdf on the
        Real Time Outage Dataset).
      - Datasets are licensed CC BY 4.0 (license_id CC-BY-4.0 returned by the CKAN
        package_show API), which is what a Presumed Open regime is supposed to
        produce.
    IMPORTANT — this verified implementation is of an infrastructure and open-data
    obligation ONLY. It must not be read as a consumer data right being implemented.
    No CDR-style register entry, no accredited-data-recipient flow, and no consumer
    consent surface exists here because none is mandated in GB.
  notMandated:
    - Consumer data portability / account data API — no GB mandate, none published.
    - Green Button / ESPI — no reference found anywhere on SSEN properties.
    - Consumer Data Standards (energy) — Australian only, not applicable.

dataStandard:
  answer: no consumer data standard reference found
  detail: |
    No Green Button/ESPI, no CDR Consumer Data Standards, no IEEE 2030.5, no
    OpenADR, no OCPP/OCPI, and no explicit IEC CIM 61968/61970 conformance claim was
    found on any SSEN property probed. The standards that ARE in play are GB
    industry data formats and platform conventions rather than API specifications:
      - Embedded Capacity Register in the format agreed through the Energy Networks
        Association Open Networks project (register v4.0), published as XLSX/CSV.
      - Long Term Development Statement (LTDS) and Distribution Future Energy
        Scenarios (DFES) — GB regulatory reporting formats, published as files.
      - DCAT — the CKAN portal runs the dcat and dcat_json_interface extensions, and
        the Opendatasoft portal exposes /catalog/exports/dcat (HTTP 200), so catalog
        metadata is DCAT-shaped.
      - CC BY 4.0 licensing across most datasets.
    API shape is platform-vendor conventional, not sector-standard: CKAN 2.10.10
    Action API for Distribution, Opendatasoft Explore API v2.1 for Transmission, and
    two bespoke SSEN-built APIs (Power Track outages, NeRDA power flow).

consumerVsMarketData:
  consumer_data_api: false
  market_data_open: true
  split: |
    This is the finding. SSEN is wide open on grid/market data and completely absent
    on consumer data — and that is exactly what the GB regime asks of it.

    MARKET / GRID DATA — OPEN. 45 CKAN datasets on the Distribution portal and 60
    Opendatasoft datasets on the Transmission portal, both queryable anonymously
    over documented platform APIs, mostly CC BY 4.0. Includes substation locations,
    Embedded Capacity Register, flexibility day-ahead bidding and dispatch reports,
    flexibility services contract register, generation availability and network
    capacity, GIS network line data, GSP/BSP supply area boundaries, LTDS, DFES
    technology projections, NAFIRS HV/LV fault data, Orkney and Isle of Wight active
    network management, real-time outages, and ETYS transmission circuits and fault
    levels.

    CONSUMER DATA — NOT OFFERED. SSEN publishes no API for an individual customer's
    usage, billing, tariff or account data, and no third-party consent flow. The one
    place customer-derived data appears is the Smart Meter LV Feeder Usage dataset,
    and it is deliberately de-individualised — aggregated to a minimum of 5
    properties per LV feeder, published as bulk open data. That is the opposite of a
    consumer data right: it is customer data turned into grid data before release.
    As a DNO, SSEN also has no retail relationship with most end customers; the
    supplier does, and GB gives that customer no statutory API-based portability
    right against either party.

accessGate:
  gate: self-serve
  gatedOverall: false
  whatADeveloperMustDo: |
    For three of the four APIs — nothing. No account, no key, no application, no
    licence signature:
      - Distribution CKAN Action API: call https://data-api.ssen.co.uk/api/3/action/*
        anonymously. Verified HTTP 200 for status_show, package_list (45 packages),
        package_show and help_show. NOTE a WAF quirk — requests with a default curl
        User-Agent get HTTP 403; a normal browser User-Agent gets 200. There is no
        credential involved, only bot filtering.
      - Power Track Real Time Outage API: call
        https://external.distribution.prd.ssen.co.uk/opendataportal-prd/v4/api/getallfaults
        anonymously. Verified HTTP 200, application/json, 17KB of live faults, plus
        /getbyid/{reference} HTTP 200.
      - Transmission Explore API: call
        https://ssentransmission.opendatasoft.com/api/explore/v2.1/* anonymously.
        Verified HTTP 200 with total_count 60.
    For NeRDA only, the gate is a free self-serve registration:
      1. Create or sign in to an SSEN account from nerda.ssen.co.uk.
      2. Accept the NeRDA Portal terms and conditions (mandatory, blocking).
      3. Open "View APIs and Manage Keys" in the portal API console and click
         Regenerate to mint an API key (shown once; regenerating clears the old key).
      SSEN also lists SSENSmart@sse.com for API access enquiries. There is no
      accreditation, no commercial agreement, and no approval committee.

authModel:
  schemes:
    - api: SSEN Distribution Data Portal API (CKAN)
      auth: none for read
      note: |
        CKAN 2.10.10. Anonymous read verified. The instance loads the "noanonaccess"
        extension, which gates the HTML dataset pages on data-api.ssen.co.uk (HTTP
        403 for /, /catalog.jsonld, /openapi.json, /swagger.json) while the /api/3
        Action API answers anonymously. Human browsing happens on the separate
        Next.js front end at data.ssen.co.uk (HTTP 200). Writes would need a CKAN API
        token, but no public write is offered.
    - api: SSEN Power Track Real Time Outage API
      auth: none
      note: Public read-only JSON, no key observed, no rate-limit headers documented.
    - api: SSEN NeRDA API
      auth: API key
      note: |
        Per the official NeRDA API Guide PDF — key generated in the portal API
        console after account creation and T&C acceptance, and the APIs also work
        in-browser while a portal session is open. Anonymous calls to the documented
        endpoints (/api/nerdastatic-SEPD, /api/nerdastatic-SEPD/2521) returned HTTP
        404 after redirect to nerda.ssen.co.uk. A 2023 SSEN update refers to moving
        API authentication to a bearer token; the current published guide describes
        an API key, so the key model is what is recorded here.
    - api: SSEN Transmission Open Data Explore API
      auth: optional API key
      note: |
        The harvested OpenAPI declares one security scheme — apiKey named "apikey"
        in query — used for private datasets. Public catalog and record reads
        succeed anonymously.
  oidc:
    probed: https://www.ssen.co.uk/.well-known/openid-configuration
    status: 404
    note: No anonymously served OpenID Connect discovery document found on the
      primary domain. NeRDA registration redirects to an SSEN login portal, but no
      public OIDC metadata is exposed.

